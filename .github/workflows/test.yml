name: Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run linting
      run: |
        cd backend
        npm run lint || echo "Linting not configured yet"
    
    - name: Run unit tests
      run: |
        cd backend
        npm run test:unit
    
    - name: Run middleware tests
      run: |
        cd backend
        npm run test:middleware
    
    - name: Run model tests
      run: |
        cd backend
        npm run test:models
    
    - name: Run route tests
      run: |
        cd backend
        npm run test:routes
    
    - name: Run plugin tests
      run: |
        cd backend
        npm run test:plugins
    
    - name: Run utility tests
      run: |
        cd backend
        npm run test:utils
    
    - name: Run integration tests
      run: |
        cd backend
        npm run test:integration
    
    - name: Run full test suite with coverage
      run: |
        cd backend
        npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate test report
      if: always()
      run: |
        cd backend
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "Node Version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "Test Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
        if [ -f coverage/lcov-report/index.html ]; then
          echo "Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "Coverage report generation failed" >> $GITHUB_STEP_SUMMARY
        fi

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run security audit
      run: |
        cd backend
        npm audit --audit-level moderate
    
    - name: Run dependency check
      run: |
        cd backend
        npm outdated || echo "Some dependencies are outdated"

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run performance tests
      run: |
        cd backend
        npm run test:e2e || echo "E2E tests not implemented yet"
    
    - name: Generate performance report
      if: always()
      run: |
        echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Performance tests completed" >> $GITHUB_STEP_SUMMARY



